<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spec Review: /book 5-day Layout</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
header { text-align: center; margin-bottom: 32px; }
h1 { font-size: 1.5rem; color: #f8fafc; margin-bottom: 8px; }
.subtitle { font-size: 0.875rem; color: #94a3b8; }
.progress-bar { background: #1e293b; border-radius: 8px; height: 8px; margin: 16px 0; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #10b981); transition: width 0.3s; border-radius: 8px; }
.progress-text { font-size: 0.75rem; color: #94a3b8; text-align: right; margin-bottom: 24px; }
.toc { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 24px; }
.toc h3 { font-size: 0.875rem; color: #94a3b8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
.toc ol { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
.toc li { background: #334155; border-radius: 6px; }
.toc a { display: block; padding: 6px 12px; font-size: 0.8rem; color: #e2e8f0; text-decoration: none; }
.toc a:hover { background: #475569; }
.status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
.status-open-question { background: #fbbf24; color: #000; }
.status-approved { background: #22c55e; color: #000; }
.status-needs-revision { background: #f97316; color: #000; }
.status-rejected { background: #ef4444; color: #fff; }
.section { background: #1e293b; border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
.section-header { padding: 16px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.section-title { font-size: 1rem; font-weight: 600; color: #f8fafc; }
.section-meta { display: flex; gap: 12px; align-items: center; font-size: 0.75rem; }
.section-body { padding: 20px; }
.spec-content { font-size: 0.9rem; line-height: 1.6; color: #cbd5e1; white-space: pre-wrap; margin-bottom: 20px; }
.spec-content code { background: #334155; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
.review-controls { display: grid; gap: 12px; }
.ratings-row { display: flex; gap: 16px; flex-wrap: wrap; }
.rating-item { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #94a3b8; }
.rating-item span { min-width: 80px; }
.rating-select { background: #334155; border: none; color: #e2e8f0; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
.status-row { display: flex; gap: 8px; flex-wrap: wrap; }
.status-btn { padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; border: 2px solid transparent; cursor: pointer; background: #334155; color: #94a3b8; transition: all 0.15s; }
.status-btn:hover { background: #475569; }
.status-btn.selected { border-color: #22c55e; background: #166534; color: #bbf7d0; }
.status-btn[data-status="needs-revision"].selected { border-color: #f97316; background: #9a3412; color: #fed7aa; }
.status-btn[data-status="rejected"].selected { border-color: #ef4444; background: #991b1b; color: #fecaca; }
.status-btn[data-status="open-question"].selected { border-color: #fbbf24; background: #854d0e; color: #fef08a; }
.comments-section { margin-top: 12px; }
.comments-label { font-size: 0.75rem; color: #94a3b8; margin-bottom: 6px; }
.comment-input { width: 100%; background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; resize: vertical; min-height: 60px; font-family: inherit; }
.comment-input:focus { outline: none; border-color: #22c55e; }
.comments-list { margin-top: 8px; display: grid; gap: 6px; }
.comment-item { background: #0f172a; border-radius: 6px; padding: 8px 10px; font-size: 0.8rem; display: flex; justify-content: space-between; gap: 8px; }
.comment-text { color: #cbd5e1; flex: 1; }
.comment-time { color: #64748b; font-size: 0.7rem; white-space: nowrap; }
.del-comment { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.7rem; padding: 2px 4px; }
.del-comment:hover { text-decoration: underline; }
.decision-section { margin-top: 12px; background: #0f172a; border-radius: 8px; padding: 12px; }
.decision-label { font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
.option-group { margin-bottom: 8px; }
.option-group-label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
.option-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.option-item input { width: 16px; height: 16px; accent-color: #22c55e; cursor: pointer; }
.option-item label { font-size: 0.85rem; color: #e2e8f0; cursor: pointer; }
.export-section { background: #1e293b; border-radius: 12px; padding: 20px; margin-top: 24px; }
.export-section h3 { font-size: 1rem; margin-bottom: 12px; color: #f8fafc; }
.export-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.btn { padding: 10px 20px; border-radius: 8px; font-size: 0.875rem; font-weight: 600; border: none; cursor: pointer; transition: all 0.15s; }
.btn-primary { background: #22c55e; color: #000; }
.btn-primary:hover { background: #16a34a; }
.btn-secondary { background: #334155; color: #e2e8f0; }
.btn-secondary:hover { background: #475569; }
#xml-preview { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; font-family: 'Courier New', monospace; font-size: 0.75rem; color: #94a3b8; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; }
.copy-feedback { color: #22c55e; font-size: 0.8rem; margin-top: 8px; display: none; }
footer { text-align: center; padding: 24px; color: #64748b; font-size: 0.75rem; }
</style>
</head>
<body>
<div class="container">
<header>
<h1>Spec Review: /book 5-day Layout</h1>
<p class="subtitle">2026-05-21-book-page-5day-layout-design.md</p>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<p class="progress-text" id="progressText">0 of 0 sections reviewed</p>
</header>

<nav class="toc">
<h3>Mục lục</h3>
<ol id="tocList"></ol>
</nav>

<div id="sections"></div>

<div class="export-section">
<h3>Export XML Prompt</h3>
<div class="export-actions">
<button class="btn btn-primary" onclick="exportXML()">Copy XML Prompt</button>
<button class="btn btn-secondary" onclick="togglePreview()">Toggle Preview</button>
<button class="btn btn-secondary" onclick="clearAll()">Clear All</button>
</div>
<pre id="xml-preview"></pre>
<p class="copy-feedback" id="copyFeedback">Copied to clipboard!</p>
</div>

<footer>Spec Review Tool v1.0</footer>
</div>

<script>
const SPEC = {
"sec-001": {
title: "Mục tiêu",
content: `• Trang /book của nhân viên chỉ hiển thị 5 ngày làm việc (T2 → T6)
• Ẩn hoàn toàn T7 và CN khỏi UI
• Xóa toàn bộ registration data cũ trong DB
• Reset và seed lại DB với dữ liệu sạch (chỉ T2-T6)`,
status: "open-question",
ratings: { clarity: 5, completeness: 4, feasibility: 5 }
},
"sec-002": {
title: "Layout — Desktop (≥768px)",
content: `Grid 5 cột bằng nhau. Mỗi card chiếm equal width.

┌───────────┬───────────┬───────────┬───────────┬───────────┐
│    T2     │    T3     │    T4     │    T5     │    T6     │
│  [card]   │  [card]   │  [card]   │  [card]   │  [card]   │
└───────────┴───────────┴───────────┴───────────┴───────────┘`,
status: "open-question",
ratings: { clarity: 4, completeness: 4, feasibility: 5 }
},
"sec-003": {
title: "Layout — Mobile (<768px) 2+3 grid",
content: `Row 1: T2, T3 (2 cột)
Row 2: T4, T5, T6 (3 cột)

┌───────────┬───────────┐
│    T2     │    T3     │
│  [card]   │  [card]   │
├───────────┼───────────┤
│    T4     │    T5     │    T6     │
│  [card]   │  [card]   │  [card]   │
└───────────────────────────┘`,
status: "open-question",
ratings: { clarity: 4, completeness: 4, feasibility: 5 }
},
"sec-004": {
title: "Thay đổi code — registrationWindow.ts",
content: `• Sửa getWeekdaysForOffset — filter bỏ dayOfWeek === 0 || dayOfWeek === 6
• Chỉ trả về 5 ngày T2-T6
• isWeekend() và isWorkday() giữ nguyên (dùng cho /my-history)`,
status: "open-question",
ratings: { clarity: 5, completeness: 5, feasibility: 5 }
},
"sec-005": {
title: "Thay đổi code — /book/page.tsx",
content: `• Xóa logic opacity-50 và disabled cho !day.isWorkday
• Grid layout đổi thành responsive 5 cột (desktop) / 2+3 grid (mobile)
• Các ngày trong tuần vẫn navigate bằng weekOffset (prev/next week)`,
status: "open-question",
ratings: { clarity: 5, completeness: 5, feasibility: 5 }
},
"sec-006": {
title: "Thay đổi code — Database",
content: `• Xóa toàn bộ Registration, RegistrationOverride, DailyMenu, DailyMenuMeal, Holiday
• Re-seed: tạo lại users, meals, và weekly menus cho tuần hiện tại (T2-T6)`,
status: "open-question",
ratings: { clarity: 5, completeness: 5, feasibility: 5 }
},
"sec-007": {
title: "Không thay đổi",
content: `• Trang /my-history — vẫn hiển thị đầy đủ 7 ngày
• Các hàm isWeekend(), isWorkday() trong registrationWindow.ts
• Logic API registration (GET/POST) — vẫn nhận data T7/CN nếu có (backward compatible)`,
status: "open-question",
ratings: { clarity: 5, completeness: 5, feasibility: 5 }
},
"sec-008": {
title: "Test checklist",
content: `[ ] /book hiển thị đúng 5 ngày T2-T6
[ ] Layout mobile: row 1 có 2 card, row 2 có 3 card
[ ] Layout desktop: 5 cột bằng nhau
[ ] Prev/Next week navigate đúng 5 ngày
[ ] Registration hoạt động bình thường
[ ] /my-history không bị ảnh hưởng`,
status: "open-question",
ratings: { clarity: 5, completeness: 4, feasibility: 5 }
}
};

const STATUS_MAP = {
"approved": { label: "Approved", cls: "status-approved" },
"needs-revision": { label: "Needs Revision", cls: "status-needs-revision" },
"rejected": { label: "Rejected", cls: "status-rejected" },
"open-question": { label: "Open", cls: "status-open-question" }
};

function render() {
  const toc = document.getElementById("tocList");
  const container = document.getElementById("sections");
  toc.innerHTML = "";
  container.innerHTML = "";

  Object.keys(SPEC).forEach((id, i) => {
    const s = SPEC[id];
    toc.innerHTML += `<li><a href="#${id}">${i+1}. ${s.title}</a></li>`;

    const section = document.createElement("div");
    section.className = "section";
    section.id = id;
    section.innerHTML = `
      <div class="section-header">
        <span class="section-title">${i+1}. ${s.title}</span>
        <div class="section-meta">
          <span class="status-badge ${STATUS_MAP[s.status]?.cls || 'status-open-question'}">${STATUS_MAP[s.status]?.label || "Open"}</span>
        </div>
      </div>
      <div class="section-body">
        <div class="spec-content">${escapeHtml(s.content)}</div>
        <div class="review-controls">
          <div class="status-row">
            <button class="status-btn ${s.status === 'approved' ? 'selected' : ''}" data-status="approved" onclick="setStatus('${id}', 'approved')">Approved</button>
            <button class="status-btn ${s.status === 'needs-revision' ? 'selected' : ''}" data-status="needs-revision" onclick="setStatus('${id}', 'needs-revision')">Needs Revision</button>
            <button class="status-btn ${s.status === 'rejected' ? 'selected' : ''}" data-status="rejected" onclick="setStatus('${id}', 'rejected')">Rejected</button>
            <button class="status-btn ${s.status === 'open-question' ? 'selected' : ''}" data-status="open-question" onclick="setStatus('${id}', 'open-question')">Open Question</button>
          </div>
          <div class="ratings-row">
            <div class="rating-item"><span>Clarity</span><select class="rating-select" onchange="setRating('${id}','clarity',this.value)">${[1,2,3,4,5].map(n => `<option value="${n}" ${s.ratings.clarity == n ? 'selected' : ''}>${n}</option>`).join("")}</select></div>
            <div class="rating-item"><span>Completeness</span><select class="rating-select" onchange="setRating('${id}','completeness',this.value)">${[1,2,3,4,5].map(n => `<option value="${n}" ${s.ratings.completeness == n ? 'selected' : ''}>${n}</option>`).join("")}</select></div>
            <div class="rating-item"><span>Feasibility</span><select class="rating-select" onchange="setRating('${id}','feasibility',this.value)">${[1,2,3,4,5].map(n => `<option value="${n}" ${s.ratings.feasibility == n ? 'selected' : ''}>${n}</option>`).join("")}</select></div>
          </div>
          <div class="comments-section">
            <div class="comments-label">Comments</div>
            <textarea class="comment-input" placeholder="Add a comment..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addComment('${id}',this.value);this.value='';}"></textarea>
            <div class="comments-list" id="comments-${id}">${(s.comments||[]).map((c,i) => `<div class="comment-item"><span class="comment-text">${escapeHtml(c.text)}</span><span class="comment-time">${c.time||''}</span><button class="del-comment" onclick="delComment('${id}',${i})">×</button></div>`).join("")}</div>
          </div>
        </div>
      </div>`;
    container.appendChild(section);
  });

  updateProgress();
  generateXML();
}

function setStatus(id, status) {
  SPEC[id].status = status;
  render();
}

function setRating(id, key, value) {
  SPEC[id].ratings[key] = parseInt(value);
  generateXML();
}

function addComment(id, text) {
  if (!text.trim()) return;
  if (!SPEC[id].comments) SPEC[id].comments = [];
  SPEC[id].comments.push({ text: text.trim(), time: new Date().toLocaleTimeString() });
  render();
}

function delComment(id, index) {
  SPEC[id].comments.splice(index, 1);
  render();
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateProgress() {
  const total = Object.keys(SPEC).length;
  const reviewed = Object.values(SPEC).filter(s => s.status !== 'open-question').length;
  const pct = total > 0 ? Math.round((reviewed/total)*100) : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${reviewed} of ${total} sections reviewed`;
}

function generateXML() {
  const now = new Date().toISOString();
  let xml = `<spec_review_prompt version="1.0">\n  <metadata>\n    <title>/book 5-day Layout Design</title>\n    <source>provided_spec</source>\n    <created_at>${now}</created_at>\n    <review_goal>Review 5-day T2-T6 layout for employee /book page with mobile-first design</review_goal>\n  </metadata>\n  <spec>\n`;

  Object.keys(SPEC).forEach((id, i) => {
    const s = SPEC[id];
    xml += `    <section id="${id}">\n      <title>${i+1}. ${escapeHtml(s.title)}</title>\n      <content><![CDATA[${s.content}]]></content>\n      <review>\n        <status>${s.status}</status>\n        <priority>should</priority>\n        <ratings>\n          <rating name="clarity">${s.ratings.clarity}</rating>\n          <rating name="completeness">${s.ratings.completeness}</rating>\n          <rating name="feasibility">${s.ratings.feasibility}</rating>\n        </ratings>\n        <comments>\n${(s.comments||[]).map(c => `          <comment>${escapeHtml(c.text)}</comment>`).join("\n")}\n        </comments>\n      </review>\n    </section>\n`;
  });

  const counts = {
    approved: Object.values(SPEC).filter(s=>s.status==='approved').length,
    needs_revision: Object.values(SPEC).filter(s=>s.status==='needs-revision').length,
    open: Object.values(SPEC).filter(s=>s.status==='open-question').length
  };

  xml += `  </spec>\n  <summary>\n    <approved_sections>${counts.approved}</approved_sections>\n    <needs_revision_sections>${counts.needs_revision}</needs_revision_sections>\n    <open_questions>${counts.open}</open_questions>\n  </summary>\n  <instruction>\n    Use the reviewed spec above as the source of truth for implementing the 5-day T2-T6 layout on the employee /book page. Focus on: registrationWindow.ts filter, book/page.tsx responsive grid (2+3 mobile, 5-col desktop), and ensure /my-history is unaffected.\n  </instruction>\n</spec_review_prompt>`;

  document.getElementById("xml-preview").textContent = xml;
  return xml;
}

function exportXML() {
  const xml = generateXML();
  navigator.clipboard.writeText(xml).then(() => {
    const fb = document.getElementById("copyFeedback");
    fb.style.display = "block";
    setTimeout(() => fb.style.display = "none", 2000);
  }).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = xml;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    document.getElementById("copyFeedback").style.display = "block";
    setTimeout(() => document.getElementById("copyFeedback").style.display = "none", 2000);
  });
}

function togglePreview() {
  const pre = document.getElementById("xml-preview");
  pre.style.display = pre.style.display === "none" ? "block" : "none";
}

function clearAll() {
  if (confirm("Clear all review data?")) {
    Object.keys(SPEC).forEach(id => {
      SPEC[id].status = "open-question";
      SPEC[id].comments = [];
    });
    render();
  }
}

render();
</script>
</body>
</html>
